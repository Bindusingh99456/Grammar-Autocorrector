<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grammar Autocorrector">
    <title>{% block title %}Grammar Autocorrector{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <div class="brand">
                <a href="/">Grammar Autocorrector</a>
            </div>
            <nav class="main-nav" aria-label="Main Navigation">
                <ul>
                    <li><a href="/" class="{% if active_page == 'editor' %}active{% endif %}">Editor</a></li>
                    <li><a href="/how-it-works" class="{% if active_page == 'how_it_works' %}active{% endif %}">How It Works</a></li>
                    <li><a href="/test-cases" class="{% if active_page == 'test_cases' %}active{% endif %}">Test Cases</a></li>
                    <li><a href="/about" class="{% if active_page == 'about' %}active{% endif %}">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <div><strong>Grammar Autocorrector</strong> &bull; REVA University</div>
            <div>Bindu Singh M (SRN: R24EJ024)</div>
        </div>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
